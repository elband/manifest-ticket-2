<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>AFVS — Offline</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: "Poppins", system-ui, sans-serif; color: #0f172a; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.10), transparent 30%),
          linear-gradient(135deg, #f8fafc 0%, #eef6ff 45%, #f0fdff 100%);
      }
      .card {
        max-width: 420px; width: 100%;
        background: #fff; border: 1px solid rgba(226, 232, 240, 0.7);
        border-radius: 20px; padding: 28px 24px; text-align: center;
        box-shadow: 0 12px 32px rgba(37, 99, 235, 0.08);
      }
      .badge {
        display: inline-flex; align-items: center; gap: 6px;
        background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
        padding: 4px 10px; border-radius: 999px;
        font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      }
      h1 { font-size: 18px; margin: 14px 0 8px; }
      p { font-size: 13px; color: #475569; margin: 0 0 18px; line-height: 1.5; }
      button {
        background: linear-gradient(180deg, #2563eb, #1d4ed8);
        color: white; border: none; padding: 10px 18px;
        border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer;
      }
      button:hover { filter: brightness(1.05); }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Offline</span>
      <h1>Anda sedang offline</h1>
      <p>
        Halaman ini hanya muncul ketika koneksi terputus. Data scan yang sudah
        tersimpan di perangkat tetap aman karena AFVS menggunakan penyimpanan
        lokal — coba muat ulang setelah koneksi kembali.
      </p>
      <button onclick="location.reload()">Muat ulang</button>
      <p id="auto" style="margin: 14px 0 0; font-size: 12px"></p>
    </main>
    <script>
      // Coba muat ulang otomatis (mis. kiosk menyala sebelum jaringan siap).
      (function () {
        var left = 15;
        var el = document.getElementById("auto");
        (function tick() {
          el.textContent = "Mencoba lagi otomatis dalam " + left + " detik…";
          if (left-- <= 0) location.reload();
          else setTimeout(tick, 1000);
        })();
      })();
    </script>
  </body>
</html>
